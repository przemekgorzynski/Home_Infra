---
services:
  samba:
    image: dockurr/samba:4.23.10
    container_name: samba
    hostname: samba.local
    environment:
      TZ: Europe/Warsaw
      # dockurr/samba reads UID/GID (not PUID/PGID). Match host przemek (1000)
      # and admins (1100) so the user can write to root:admins 0775 datasets.
      UID: 1000
      GID: 1100
      USER: "przemek"
      PASS: ${SAMBA_PASSWORD_PRZEMEK}
    ports:
      - 445:445
    volumes:
      - /data/public:/data/public
      - /data/priv:/data/priv
      - /data-ssd/torrent:/data/torrent
      - /data/photos:/data/photos
      - /data/media:/data/media
      - /data/media/movies:/data/media/movies
      - /data/media/tv-series:/data/media/tv-series
      - /data/media/other:/data/media/other
      - /data/files:/data/files
      - /opt/stacks/samba/smb.conf:/etc/samba/smb.conf
    healthcheck:
      test: ["CMD", "pgrep", "smbd"]
      interval: 60s
      timeout: 15s
      retries: 3
    restart: always
