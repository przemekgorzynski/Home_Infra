---
- name: Create samba stack directory
  ansible.builtin.file:
    path: /opt/stacks/samba
    state: directory
    mode: '0755'

- name: Ensure public share directory is guest-writable
  ansible.builtin.file:
    path: /data/public
    state: directory
    mode: '0777'

- name: Check for share content not writable by admins
  ansible.builtin.shell:
    cmd: >-
      find /data/files /data/media /data/photos
      \( ! -group admins -o ! -perm -g+rw -o -type d ! -perm -g+xs \) -print -quit
  register: samba_bad_perms
  changed_when: false

- name: Make share content group-writable for admins
  ansible.builtin.shell:
    cmd: |
      set -e
      chown -R :admins /data/files /data/media /data/photos
      chmod -R g+rwX /data/files /data/media /data/photos
      find /data/files /data/media /data/photos -type d -exec chmod g+s {} +
  when: samba_bad_perms.stdout | length > 0

- name: Deploy smb.conf
  ansible.builtin.copy:
    src: smb.conf
    dest: /opt/stacks/samba/smb.conf
    owner: root
    group: root
    mode: '0644'

- name: Deploy compose file
  ansible.builtin.copy:
    src: compose.yml
    dest: /opt/stacks/samba/compose.yml
    owner: root
    group: root
    mode: '0644'

- name: Run Samba via Docker Compose
  ansible.builtin.shell:
    cmd: docker compose up -d --remove-orphans
    chdir: /opt/stacks/samba
  environment:
    SAMBA_PASSWORD_PRZEMEK: "{{ SAMBA_PASSWORD_PRZEMEK }}"
  no_log: true
