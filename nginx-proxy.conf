# =============================================================================
# nginx-proxy  --  the front door for every website in the house
# Runs on the Raspberry Pi at 192.168.10.10
# =============================================================================
#
# WHAT THIS BOX DOES, IN ONE SENTENCE
# -----------------------------------
# Every web request from the internet or the house arrives here first, and this
# file decides which server it gets sent on to.
#
# WHY IT EXISTS
# -------------
# The house has one public IP address and one port 443 (the port used by
# https://). But there are several servers behind it. The router cannot tell
# them apart, because a router only looks at IP addresses and port numbers --
# it never sees which website you asked for. This proxy can see the website
# name, so it does the sorting.
#
#     internet ---> router ---> THIS BOX ---> the right server
#
# HOW IT KNOWS THE WEBSITE NAME WITHOUT DECRYPTING ANYTHING
# ---------------------------------------------------------
# When your browser starts an https connection it sends the website name in
# clear text in the very first message ("hello, I want to talk to
# argo.homebay.dev"). That field is called SNI. The `ssl_preread on;` setting
# below tells nginx to peek at that field and then pass the still-encrypted
# connection along untouched.
#
# This matters: nginx never decrypts anything, so no HTTPS certificates live on
# this Pi. Each k3s cluster keeps its own certificates exactly as before. This
# box is a signpost, not a post office -- it reads the address on the envelope
# and never opens it.
#
# THE TWO SERVERS TRAFFIC CAN BE SENT TO
# --------------------------------------
#     192.168.10.20   cluster 1   homebay.dev and internal.homebay.dev
#     192.168.10.30   cluster 2   huddleao.app
#
# =============================================================================
# HOW TO RUN IT
# =============================================================================
#
# First time -- start the container:
#
#   sudo docker run -d --name nginx-proxy --restart unless-stopped \
#       --network host \
#       -v /opt/nginx-proxy/nginx.conf:/etc/nginx/nginx.conf:ro \
#       nginx:alpine
#
# What those options mean:
#   -d                     run in the background
#   --name nginx-proxy     give it a name so you can refer to it later
#   --restart unless-stopped   start again automatically after a reboot
#   --network host         MUST STAY. See the warning further down.
#   -v ...:ro              hand this config file to the container, read-only
#
# After changing this file -- check it, then apply it:
#
#   sudo cp nginx.conf /opt/nginx-proxy/nginx.conf     # use cp, NOT sed -i
#   sudo docker exec nginx-proxy nginx -t              # test for typos first
#   sudo docker exec nginx-proxy nginx -s reload       # apply, no downtime
#
# Useful checks:
#
#   sudo docker ps                                     # is it running?
#   sudo docker exec nginx-proxy tail -20 /var/log/nginx/stream.log
#   sudo docker logs nginx-proxy                       # startup errors
#   sudo docker restart nginx-proxy                    # full restart
#
# TWO TRAPS THAT HAVE ALREADY BITTEN US
# -------------------------------------
# 1. Always edit with `cp`. Do NOT use `sed -i` or an editor that saves by
#    renaming. Docker attaches to the *file itself*, not its name, so those
#    tools quietly disconnect the container and it keeps serving the OLD
#    config while the file on disk looks correct. If a change seems ignored,
#    compare them:
#      sudo md5sum /opt/nginx-proxy/nginx.conf
#      sudo docker exec nginx-proxy md5sum /etc/nginx/nginx.conf
#    Different? Run: sudo docker restart nginx-proxy
#
# 2. Never swap --network host for -p 80:80 -p 443:443. With published ports
#    Docker rewrites the visitor's address, so everyone would look like they
#    are inside the house and the LAN-only rule below would let the whole
#    internet in.
#
# =============================================================================

worker_processes auto;                      # use all CPU cores
error_log /var/log/nginx/error.log warn;    # where problems get written
pid       /var/run/nginx.pid;

events {
    worker_connections 1024;                # max simultaneous connections
}

# The "stream" section handles raw connections that we pass through without
# opening them. This is where the https sorting happens.
stream {

    # -------------------------------------------------------------------
    # STEP 1: is this visitor inside the house, or out on the internet?
    #
    # Everything starting 192.168.x.x is inside. Anything else is outside.
    # $from_lan becomes 1 for inside, 0 for outside.
    #
    # Requests from a phone or laptop in the house that went "out and back"
    # through the router show up as 192.168.10.1 (the router itself). That is
    # still inside the house, and this range covers it.
    #
    # !! IMPORTANT !!
    # This only works because the router has src-address=192.168.0.0/16 on its
    # "NAT: hairpin proxy" rule. Without that, the router stamps its own
    # address on internet visitors too, everyone looks like they are inside,
    # and STEP 3 lets strangers reach internal.homebay.dev. If that ever
    # happens, check the router rule FIRST -- this file will look perfectly
    # correct while being told lies.
    # -------------------------------------------------------------------
    geo $from_lan {
        default        0;      # anyone not matched below = internet
        192.168.0.0/16 1;      # our own network = inside the house
    }

    # -------------------------------------------------------------------
    # STEP 2: two address books -- one for visitors inside the house,
    #         one for visitors from the internet.
    #
    # Read each line as: "if the website name ends with X, send it to Y".
    # The `~` means "match the end of the name", so one line covers every
    # sub-name too (app.huddleao.app, shop.huddleao.app, and so on).
    # `default` catches anything not listed above it.
    #
    # Keep both books in step when you add a domain. The ONLY intended
    # difference is the internal.homebay.dev line.
    # -------------------------------------------------------------------

    # Visitors inside the house may reach everything.
    map $ssl_preread_server_name $backend_from_lan {
        ~internal\.homebay\.dev$   192.168.10.20:443;   # cluster 1
        ~huddleao\.app$            192.168.10.30:443;   # cluster 2
        default                    192.168.10.20:443;   # cluster 1
    }

    # Visitors from the internet may reach everything EXCEPT internal.*
    # An empty "" means "no destination", so nginx hangs up on them.
    map $ssl_preread_server_name $backend_from_internet {
        ~internal\.homebay\.dev$   "";                  # blocked -- family only
        ~huddleao\.app$            192.168.10.30:443;   # cluster 2
        default                    192.168.10.20:443;   # cluster 1
    }

    # -------------------------------------------------------------------
    # STEP 3: pick which address book to use, based on STEP 1.
    # -------------------------------------------------------------------
    map $from_lan $backend {
        1       $backend_from_lan;        # inside the house
        default $backend_from_internet;   # out on the internet
    }

    # -------------------------------------------------------------------
    # A log line per connection, so you can see what was decided.
    # Read it as: who asked, what they asked for, inside or out, where it went.
    #   192.168.10.186 [...] sni=argo.homebay.dev lan=1 -> 192.168.10.20:443 200
    # A blocked one looks like this -- note the empty destination:
    #   79.162.22.5 [...] sni=jellyfin.internal.homebay.dev lan=0 ->  500 0
    # -------------------------------------------------------------------
    log_format sni '$remote_addr [$time_local] sni=$ssl_preread_server_name '
                   'lan=$from_lan -> $backend $status $bytes_sent';
    access_log /var/log/nginx/stream.log sni;

    # -------------------------------------------------------------------
    # STEP 4: listen for https and hand the connection on.
    # -------------------------------------------------------------------
    server {
        listen      443;          # the https port
        ssl_preread on;           # peek at the website name (see top of file)
        proxy_pass  $backend;     # send it wherever STEP 3 decided
    }
}

# The "http" section handles plain, unencrypted web traffic on port 80.
http {
    access_log /var/log/nginx/access.log;

    # Plain http does not contain the website name early enough for the trick
    # above, so we do not try to sort it. We just tell the browser "use https
    # instead" and it comes straight back to port 443, where sorting works.
    server {
        listen 80 default_server;
        return 301 https://$host$request_uri;
    }
}
